name: build

on:
  push:
  pull_request:

jobs:
  fedora:
    name: Fedora ${{ matrix.container }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: [fedora:42, fedora:44]
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: >
          dnf install -y
          gcc glib2-devel cairo-devel meson ninja-build pkg-config rofi-devel
      - name: Configure
        run: meson setup build --buildtype=release -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  quality:
    name: Clang, analyzer and sanitizers
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v5
      - name: Install quality dependencies
        run: >
          dnf install -y
          gcc clang glib2-devel cairo-devel meson ninja-build pkg-config
          rofi-devel libasan libubsan
      - name: Clang build and tests
        run: |
          CC=clang meson setup build-clang --buildtype=release -Dwerror=true
          meson compile -C build-clang
          meson test -C build-clang --print-errorlogs
      - name: GCC static analysis
        run: |
          meson setup build-analyzer --buildtype=debug -Dwerror=true -Dc_args=-fanalyzer
          meson compile -C build-analyzer
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson setup build-asan --buildtype=debug -Db_sanitize=address,undefined -Dwerror=true
          meson compile -C build-asan
          meson test -C build-asan --print-errorlogs

  packaging:
    name: RPM and PKGBUILD validation
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging dependencies
        run: >
          dnf install -y
          gcc git glib2-devel cairo-devel meson ninja-build pkg-config
          rofi-devel rpm-build rpmdevtools
      - name: Validate metadata
        run: |
          bash -n packaging/PKGBUILD
          rpmspec -P packaging/rofi-universal.spec >/dev/null
          meson_version=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" meson.build | head -1)
          spec_version=$(rpmspec -q --srpm --qf '%{version}' packaging/rofi-universal.spec)
          test "$meson_version" = "$spec_version"
      - name: Build RPM
        run: |
          rpmdev-setuptree
          version=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" meson.build | head -1)
          git archive --format=tar.gz --prefix="rofi-universal-$version/" \
            -o "$HOME/rpmbuild/SOURCES/rofi-universal-$version.tar.gz" HEAD
          rpmbuild -ba packaging/rofi-universal.spec
          rpm -qlp "$HOME"/rpmbuild/RPMS/*/rofi-universal-"$version"-1*.rpm
