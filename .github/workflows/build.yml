name: build

on:
  push:
  pull_request:

jobs:
  fedora:
    name: Fedora ${{ matrix.container }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: [fedora:42, fedora:44]
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: >
          dnf install -y
          gcc glib2-devel cairo-devel json-glib-devel meson ninja-build pkg-config
          rofi-devel python3 python3-gobject dbus-daemon xorg-x11-server-Xvfb
          xorg-x11-xauth xdotool
      - name: Configure
        run: meson setup build --buildtype=release -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Load plugin through Rofi
        run: xvfb-run -a env ROFI_UNIVERSAL_BUILD="$PWD/build" python3 tests/test_integration.py
      - name: Rapid query and teardown smoke test
        run: xvfb-run -a env ROFI_UNIVERSAL_BUILD="$PWD/build" python3 tests/test_rapid_queries.py
      - name: File reveal fallback test
        run: xvfb-run -a env ROFI_UNIVERSAL_BUILD="$PWD/build" python3 tests/test_file_actions.py
      - name: FileManager1 success-path test
        run: dbus-run-session -- xvfb-run -a env ROFI_UNIVERSAL_BUILD="$PWD/build" python3 tests/test_filemanager_dbus.py
      - name: Clipboard decode/copy test
        run: xvfb-run -a env ROFI_UNIVERSAL_BUILD="$PWD/build" python3 tests/test_clipboard_actions.py
      - name: Install and uninstall scripts
        run: |
          PREFIX=/tmp/ru-install XDG_CONFIG_HOME=/tmp/ru-config ./scripts/install.sh
          test -f /tmp/ru-install/bin/rofi-universal
          test -f /tmp/ru-install/lib64/rofi/libuniversal.so || test -f /tmp/ru-install/lib/rofi/libuniversal.so
          test -f /tmp/ru-install/share/rofi-universal/config.example.ini
          test -f /tmp/ru-config/rofi-universal/config.ini
          PREFIX=/tmp/ru-install ./scripts/uninstall.sh
          test ! -e /tmp/ru-install/bin/rofi-universal
          test ! -e /tmp/ru-install/lib64/rofi/libuniversal.so
          test ! -e /tmp/ru-install/lib/rofi/libuniversal.so
          test ! -e /tmp/ru-install/share/rofi-universal/config.example.ini
          test -f /tmp/ru-config/rofi-universal/config.ini

  quality:
    name: Clang, analyzer and sanitizers
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v5
      - name: Install quality dependencies
        run: >
          dnf install -y
          gcc clang glib2-devel cairo-devel json-glib-devel meson ninja-build
          pkg-config rofi-devel libasan libubsan
      - name: Clang build and tests
        run: |
          CC=clang meson setup build-clang --buildtype=release -Dwerror=true
          meson compile -C build-clang
          meson test -C build-clang --print-errorlogs
      - name: GCC static analysis
        run: |
          meson setup build-analyzer --buildtype=debug -Dwerror=true -Dc_args=-fanalyzer
          meson compile -C build-analyzer
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson setup build-asan --buildtype=debug -Db_sanitize=address,undefined -Dwerror=true
          meson compile -C build-asan
          meson test -C build-asan --print-errorlogs

  fedora-package:
    name: Fedora ${{ matrix.container }} package lifecycle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: [fedora:42, fedora:44]
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging dependencies
        run: >
          dnf install -y
          gcc glib2-devel cairo-devel json-glib-devel meson ninja-build pkg-config
          rofi-devel rpm-build rpmdevtools python3 xorg-x11-server-Xvfb
          xorg-x11-xauth
      - name: Build RPM and verify source checksum
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" meson.build | head -1)
          expected=$(sed -n "s/^sha256sums=('\([0-9a-f]*\)').*/\1/p" packaging/PKGBUILD)
          actual=$(scripts/make-source-tarball.sh "$version" "/tmp/rofi-universal-$version.tar" | awk '{print $1}')
          test -n "$expected"
          test "$actual" = "$expected"
          rpmdev-setuptree
          cp "/tmp/rofi-universal-$version.tar" "$HOME/rpmbuild/SOURCES/"
          rpmbuild -ba packaging/rofi-universal.spec
          rpm -qip "$HOME"/rpmbuild/RPMS/*/rofi-universal-"$version"-1*.rpm
          rpm -qlp "$HOME"/rpmbuild/RPMS/*/rofi-universal-"$version"-1*.rpm
      - name: Install, load and remove package
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" meson.build | head -1)
          mkdir -p /root/.config/rofi-universal
          printf '[general]\n' >/root/.config/rofi-universal/config.ini
          dnf install -y --nogpgcheck "$HOME"/rpmbuild/RPMS/*/rofi-universal-"$version"-1*.rpm
          test -f /usr/bin/rofi-universal
          test -f /usr/lib64/rofi/libuniversal.so
          xvfb-run -a env ROFI_UNIVERSAL_BUILD=/usr/lib64/rofi python3 tests/test_integration.py
          dnf remove -y rofi-universal
          test ! -e /usr/bin/rofi-universal
          test ! -e /usr/lib64/rofi/libuniversal.so
          test -f /root/.config/rofi-universal/config.ini

  arch:
    name: Arch Linux package lifecycle
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Prepare container
        run: pacman -Syu --noconfirm --needed git nodejs
      - uses: actions/checkout@v5
      - name: Install packaging dependencies
        run: >
          pacman -S --noconfirm --needed
          base-devel meson ninja rofi json-glib namcap xorg-server-xvfb python
      - name: Build package and validate checksum
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          version=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" meson.build | head -1)
          expected=$(sed -n "s/^sha256sums=('\([0-9a-f]*\)').*/\1/p" packaging/PKGBUILD)
          mkdir -p /tmp/srcdest
          chown -R builder:builder /tmp/srcdest
          su builder -c "cd '$GITHUB_WORKSPACE' && scripts/make-source-tarball.sh '$version' /tmp/srcdest/rofi-universal-$version.tar"
          actual=$(sha256sum /tmp/srcdest/rofi-universal-"$version".tar | awk '{print $1}')
          test -n "$expected"
          test "$actual" = "$expected"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging' && SRCDEST=/tmp/srcdest makepkg --noconfirm"
          pkg=$(find "$GITHUB_WORKSPACE/packaging" -name 'rofi-universal-[0-9]*.pkg.tar.zst' -print -quit)
          test -n "$pkg"
          namcap "$pkg" | tee /tmp/namcap.log
          ! grep -q '^E:' /tmp/namcap.log
      - name: Install, load and remove package
        run: |
          pkg=$(find "$GITHUB_WORKSPACE/packaging" -name 'rofi-universal-[0-9]*.pkg.tar.zst' -print -quit)
          pacman -U --noconfirm "$pkg"
          test -f /usr/bin/rofi-universal
          test -f /usr/lib/rofi/libuniversal.so
          mkdir -p /root/.config/rofi-universal
          printf '[general]\n' >/root/.config/rofi-universal/config.ini
          xvfb-run -a env ROFI_UNIVERSAL_BUILD=/usr/lib/rofi python3 tests/test_integration.py
          pacman -R --noconfirm rofi-universal
          test ! -e /usr/bin/rofi-universal
          test ! -e /usr/lib/rofi/libuniversal.so
          test -f /root/.config/rofi-universal/config.ini

  debian-family:
    name: ${{ matrix.container }} source install
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: [ubuntu:26.04, debian:testing]
    container: ${{ matrix.container }}
    steps:
      - name: Prepare container
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: >
          apt-get install -y
          build-essential meson ninja-build pkg-config libglib2.0-dev
          libcairo2-dev libjson-glib-dev rofi rofi-dev xvfb xauth python3
      - name: Configure, build and test
        run: |
          meson setup build-deb --buildtype=release -Dwerror=true
          meson compile -C build-deb
          meson test -C build-deb --print-errorlogs
      - name: Source install and plugin load
        run: |
          rm -rf /tmp/ru-config
          mkdir -p /tmp/ru-config/rofi-universal
          printf '[general]\nmax_results=17\n' > /tmp/ru-config/rofi-universal/config.ini
          PREFIX=/usr BUILDDIR=build-deb XDG_CONFIG_HOME=/tmp/ru-config ./scripts/install.sh
          test -f /usr/lib/x86_64-linux-gnu/rofi/libuniversal.so
          test -f /usr/bin/rofi-universal
          grep -q 'max_results=17' /tmp/ru-config/rofi-universal/config.ini
          xvfb-run -a env ROFI_UNIVERSAL_BUILD=/usr/lib/x86_64-linux-gnu/rofi python3 tests/test_integration.py
      - name: Uninstall preserves configuration
        run: |
          PREFIX=/usr ./scripts/uninstall.sh
          test ! -e /usr/lib/x86_64-linux-gnu/rofi/libuniversal.so
          test ! -e /usr/bin/rofi-universal
          grep -q 'max_results=17' /tmp/ru-config/rofi-universal/config.ini
