# rofi-universal configuration
# Copy to ~/.config/rofi-universal/config.ini (or set ROFI_UNIVERSAL_CONFIG).

[general]
# Maximum number of combined results shown.
max_results=40
# Any name understood by u_search_url(), or a URL template containing %s.
# Examples: duckduckgo, google, brave, startpage, wikipedia, bing,
# arch, man, docs, pkg
web_engine=duckduckgo
# Used only if the desktop has no URL handler.
open_command=xdg-open

[providers]
applications=true
calculator=true
web=true
files=true
clipboard=true
dictionary=true
github=true
weather=true
bookmarks=true

[files]
# Colon-separated roots searched by fd when a query looks like an app name.
roots=~
max_depth=4
max_results=8

[clipboard]
# Search clipboard entries during normal (non-prefixed) searches too.
# Disabled by default because clipboard history may contain sensitive data.
automatic=false
# Decoding a selected item is bounded to 4 MiB and text-only.
# Reuse the in-memory cliphist cache for this many seconds.
cache_seconds=30
max_results=10

[dictionary]
# Reuse a parsed definition and its inline Rofi results for this many seconds.
cache_seconds=86400
# Timeout for the optional curl/wget dictionary request.
timeout_seconds=4

[weather]
# Used for a bare "weather" query. Leave empty to require a city in the query.
location=
# Reuse an in-memory inline weather summary for this many seconds.
cache_seconds=600
# Timeout for the optional curl/wget request. The Rofi UI is never blocked.
timeout_seconds=4

[currency]
# Reuse in-memory Frankfurter reference rates for this many seconds.
cache_seconds=21600
# Timeout for the optional curl/wget request. The Rofi UI is never blocked.
timeout_seconds=4
